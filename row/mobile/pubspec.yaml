name: rotary_flutter_app
description: "ROW (Roster On Wheels) mobile app"
publish_to: 'none'
version: 59.0.42+132201 #old 59.0.9+10, 59.0.7+8  #current on live : 59.0.19+132176  #Android Play Store ceiling cleared at +132159; minSdk pinned to 21 at +132163

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Localizations (required by flutter_quill)
  flutter_localizations:

    sdk: flutter

  # Networking
  http: ^1.2.1
  # Derive the correct Content-Type for multipart file parts (image/pdf
  # uploads). Without this, parts default to application/octet-stream and the  //1334
  # backend rejects them ("Logo must be an image file"). 10:20,12.05,11:50,8:30,8:50,10:00,9:51,9:27
  http_parser: ^4.0.0
  mime: ^2.0.0
  # iOS: route http through Apple's NSURLSession so we use the OS trust store
  # (same as Safari) instead of Dart/BoringSSL's bundled CA list. Fixes TLS
  # handshake failures in release builds when the server cert chains through
  # a root not in Dart's bundled list.
  cupertino_http: ^2.0.0

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^14.2.0

  # OTP Input
  # QR Code
  qr_flutter: ^4.1.0

  # Location (Club Finder near-me)
  geolocator: ^11.0.0

  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  cupertino_icons: ^1.0.9

  # Image / File Handling
  image_picker: ^1.0.7
  image_cropper: ^8.0.2
  file_picker: ^8.0.3

  # Charts
  fl_chart: ^0.68.0

  # Date/Time
  intl: ^0.20.0
  timezone: ^0.9.4

  # Connectivity & Launcher
  connectivity_plus: ^6.0.3
  url_launcher: ^6.2.5

  # Permissions (used by image_picker, file_picker on Android)
  permission_handler: ^11.4.0

  # In-app browser (used by WebView screen)
  flutter_inappwebview: ^6.1.5

  # Native Razorpay checkout (wallet top-up + club website purchase). Opens a
  # native payment screen and returns success/failure via method-channel events
  # — no embedded web view that can get stuck on the success page.
  razorpay_flutter: ^1.4.5

  # HTML rendering (used by District website About display)
  flutter_html: ^3.0.0-beta.2

  # Rich text editor for About content (Quill + HTML round-trip)
  flutter_quill: ^11.5.1  # 11.5.0 lacks TextInputClient.onFocusReceived (Flutter 3.44+)
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.4.4

  # App version + build number (drawer footer)
  package_info_plus: ^8.0.0

  # AG Reports — XLSX export + share + open
  excel: ^4.0.6
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # Club Monthly Report — native PDF / Word generation
  pdf: ^3.11.0
  archive: ^3.6.1

  # Biometric app lock (Face ID / Fingerprint)
  local_auth: ^2.3.0

  # Firebase Cloud Messaging — push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Firebase Analytics — app usage events. Uses the advertising ID, so
  # AndroidManifest declares AD_ID and Play Console declaration stays "Yes".
  firebase_analytics: ^11.3.3
  # Foreground notification banner (FCM in foreground doesn't show one)
  flutter_local_notifications: ^17.2.3
  smart_auth: ^3.2.0
  phone_numbers_parser: ^9.0.23
  flutter_contacts: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  image: ^4.3.0 # tool/flatten_icon.dart (icon generation script)
flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/images/row-app-icon.png"
  image_path_ios: "assets/images/row-app-icon.png"
  remove_alpha_ios: true
  # The ROW favicon's field (row/website/app/icon.png); sources built from the website brand files.
  # shortcut: the 1024px master is scaled up from the 640px website logo, replace it with a 1024px master from the designer before the store release.
  background_color_ios: "#1E1C20"
  adaptive_icon_background: "#1E1C20"
  adaptive_icon_foreground: "assets/images/row-app-icon-foreground.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Fellowship type (design.md §2): Figtree for text, Bricolage Grotesque for display.
  # Variable fonts from github.com/google/fonts, SIL OFL 1.1 (licences beside them).
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
